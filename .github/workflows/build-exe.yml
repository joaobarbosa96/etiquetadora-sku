name: Build Windows EXE

# Roda automaticamente quando você subir mudanças no main.py,
# ou manualmente pelo botão "Run workflow" na aba Actions do GitHub.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'main.py'
  workflow_dispatch:  # permite rodar manualmente a qualquer momento

jobs:
  build:
    runs-on: windows-latest   # <- Windows real, na nuvem, gratuito

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pandas openpyxl reportlab Pillow pywin32 pyinstaller

      - name: Compilar EtiquetadoraSKU.exe
        run: |
          pyinstaller --onefile --windowed --name="EtiquetadoraSKU" `
            --collect-all customtkinter `
            --hidden-import win32print `
            --hidden-import win32api `
            main.py

      - name: Publicar o executável (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: EtiquetadoraSKU-exe
          path: dist/EtiquetadoraSKU.exe
          retention-days: 90
